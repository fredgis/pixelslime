<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-opacity=".25"/></filter>
    <clipPath id="s1"><rect x="0" y="0" width="320" height="480" rx="12"/></clipPath>
    <clipPath id="s2"><rect x="0" y="0" width="320" height="480" rx="12"/></clipPath>
    <clipPath id="s3"><rect x="0" y="0" width="320" height="480" rx="12"/></clipPath>
    <clipPath id="s4"><rect x="0" y="0" width="320" height="480" rx="12"/></clipPath>
    <style>
      .title{font-family:Arial,sans-serif;font-weight:700;fill:#17191d}
      .pixel{font-family:Consolas,monospace;font-weight:700}
      .body{font-family:Arial,sans-serif}
    </style>
  </defs>
  <rect width="1800" height="900" fill="#f1f2f4"/>
  <text x="65" y="65" class="title" font-size="38">PixelSlime POD: gallery screens</text>
  <text x="67" y="103" class="body" font-size="20" fill="#545861">Four device views controlled by the three physical buttons</text>

  <g transform="translate(55 155)" filter="url(#shadow)">
    <rect x="-18" y="-18" width="356" height="556" rx="34" fill="#17181c"/>
    <g clip-path="url(#s1)">
      <rect width="320" height="480" fill="#fff6e5"/>
      <rect width="320" height="62" fill="#2b1b4a"/>
      <text x="160" y="27" text-anchor="middle" class="pixel" font-size="18" fill="#fff">SLIMEDEX</text>
      <text x="160" y="49" text-anchor="middle" class="pixel" font-size="11" fill="#7fe3c0">14 CARDS BLOOMED</text>
      <rect x="16" y="78" width="288" height="30" rx="15" fill="#fff" stroke="#2b1b4a" stroke-width="3"/>
      <text x="32" y="99" class="pixel" font-size="11" fill="#5b4a7d">SORT: NEWEST</text>
      <rect x="16" y="126" width="136" height="176" rx="10" fill="#fff" stroke="#8b6fe8" stroke-width="4"/>
      <image x="22" y="132" width="124" height="166" preserveAspectRatio="xMidYMid meet" xlink:href="gallery-thundersnuggle.webp"/>
      <rect x="168" y="126" width="136" height="176" rx="10" fill="#fff" stroke="#ff8fc5" stroke-width="4"/>
      <image x="174" y="132" width="124" height="166" preserveAspectRatio="xMidYMid meet" xlink:href="gallery-mochibo.webp"/>
      <rect x="16" y="318" width="136" height="128" rx="10" fill="#fff" stroke="#8fd3ff" stroke-width="4"/>
      <image x="22" y="324" width="124" height="118" preserveAspectRatio="xMidYMid meet" xlink:href="gallery-nimbusnooze.webp"/>
      <rect x="168" y="318" width="136" height="128" rx="10" fill="#37265d" stroke="#5b4a7d" stroke-width="4"/>
      <text x="236" y="371" text-anchor="middle" class="pixel" font-size="33" fill="#8d79b9">11</text>
      <text x="236" y="411" text-anchor="middle" class="pixel" font-size="10" fill="#c3b0e8">MORE CARDS</text>
      <rect x="12" y="452" width="296" height="28" fill="#2b1b4a"/>
      <text x="160" y="471" text-anchor="middle" class="pixel" font-size="10" fill="#fff">← MOVE · CENTER OPENS →</text>
    </g>
    <text x="160" y="522" text-anchor="middle" class="pixel" font-size="16" fill="#fff">1 · GRID</text>
  </g>

  <g transform="translate(495 155)" filter="url(#shadow)">
    <rect x="-18" y="-18" width="356" height="556" rx="34" fill="#17181c"/>
    <g clip-path="url(#s2)">
      <rect width="320" height="480" fill="#241a3f"/>
      <image x="0" y="0" width="320" height="480" preserveAspectRatio="none" xlink:href="mochibo-screen.png"/>
      <rect x="0" y="0" width="320" height="38" fill="#000000" opacity=".62"/>
      <text x="160" y="25" text-anchor="middle" class="pixel" font-size="14" fill="#fff"
            paint-order="stroke" stroke="#000000" stroke-width="3" stroke-linejoin="round">2 / 14 · MOCHIBO</text>
      <path d="M24 195l-15 15 15 15" fill="none" stroke="#8fd3ff" stroke-width="8"/>
      <path d="M296 195l15 15-15 15" fill="none" stroke="#ff8fc5" stroke-width="8"/>
      <rect x="33" y="366" width="254" height="76" rx="14" fill="#fff6e5"/>
      <text x="160" y="389" text-anchor="middle" class="pixel" font-size="14" fill="#2b1b4a">EPIC · FAIRY · LV 12</text>
      <text x="160" y="406" text-anchor="middle" class="pixel" font-size="10" fill="#5b4a7d">PS-0013</text>
      <line x1="49" y1="415" x2="271" y2="415" stroke="#e4d6c2" stroke-width="1"/>
      <text x="160" y="433" text-anchor="middle" class="pixel" font-size="11" fill="#8b6fe8">CENTER: DETAILS</text>
    </g>
    <text x="160" y="522" text-anchor="middle" class="pixel" font-size="16" fill="#fff">2 · CARD</text>
  </g>

  <g transform="translate(935 155)" filter="url(#shadow)">
    <rect x="-18" y="-18" width="356" height="556" rx="34" fill="#17181c"/>
    <g clip-path="url(#s3)">
      <rect width="320" height="480" fill="#fff6e5"/>
      <rect width="320" height="54" fill="#c08bff"/>
      <text x="160" y="23" text-anchor="middle" class="pixel" font-size="16" fill="#2b1b4a">MOCHIBO</text>
      <text x="160" y="43" text-anchor="middle" class="pixel" font-size="10" fill="#2b1b4a">EPIC · AURORA · FAIRY</text>
      <image x="12" y="68" width="125" height="188" preserveAspectRatio="xMidYMid meet" xlink:href="gallery-mochibo.webp"/>
      <text x="153" y="94" class="pixel" font-size="11" fill="#2b1b4a">STRENGTH</text>
      <rect x="153" y="104" width="140" height="12" rx="6" fill="#ddd4e8"/><rect x="153" y="104" width="39" height="12" rx="6" fill="#ff7a59"/>
      <text x="153" y="143" class="pixel" font-size="11" fill="#2b1b4a">ENDURANCE</text>
      <rect x="153" y="153" width="140" height="12" rx="6" fill="#ddd4e8"/><rect x="153" y="153" width="77" height="12" rx="6" fill="#7fe3c0"/>
      <text x="153" y="192" class="pixel" font-size="11" fill="#2b1b4a">AGILITY</text>
      <rect x="153" y="202" width="140" height="12" rx="6" fill="#ddd4e8"/><rect x="153" y="202" width="91" height="12" rx="6" fill="#8fd3ff"/>
      <text x="153" y="241" class="pixel" font-size="11" fill="#2b1b4a">HAPPINESS</text>
      <rect x="153" y="251" width="140" height="12" rx="6" fill="#ddd4e8"/><rect x="153" y="251" width="133" height="12" rx="6" fill="#ff8fc5"/>
      <rect x="16" y="282" width="288" height="125" rx="14" fill="#fff" stroke="#2b1b4a" stroke-width="3"/>
      <text x="30" y="308" class="pixel" font-size="11" fill="#8b6fe8">SUGAR SQUISH</text>
      <text x="30" y="337" class="body" font-size="15" fill="#2b1b4a">Sweet and cuddly.</text>
      <text x="30" y="360" class="body" font-size="15" fill="#2b1b4a">Loves cozy places</text>
      <text x="30" y="383" class="body" font-size="15" fill="#2b1b4a">and spreading joy!</text>
      <text x="160" y="446" text-anchor="middle" class="pixel" font-size="11" fill="#5b4a7d">CENTER: QR CODE</text>
    </g>
    <text x="160" y="522" text-anchor="middle" class="pixel" font-size="16" fill="#fff">3 · DETAILS</text>
  </g>

  <g transform="translate(1375 155)" filter="url(#shadow)">
    <rect x="-18" y="-18" width="356" height="556" rx="34" fill="#17181c"/>
    <g clip-path="url(#s4)">
      <rect width="320" height="480" fill="#fff"/>
      <text x="160" y="34" text-anchor="middle" class="pixel" font-size="15" fill="#2b1b4a">OPEN ON WEBSITE</text>
      <image x="55" y="72" width="210" height="210" preserveAspectRatio="xMidYMid meet" xlink:href="pixelslime-profile-qr.png"/>
      <image x="116" y="310" width="88" height="132" preserveAspectRatio="xMidYMid meet" xlink:href="gallery-mochibo.webp"/>
      <text x="160" y="304" text-anchor="middle" class="pixel" font-size="11" fill="#8b6fe8">PIXELSLIME.CLOUD/SLIME/13</text>
      <text x="160" y="459" text-anchor="middle" class="pixel" font-size="10" fill="#5b4a7d">CENTER: BACK TO CARD</text>
    </g>
    <text x="160" y="522" text-anchor="middle" class="pixel" font-size="16" fill="#fff">4 · QR CODE</text>
  </g>

  <g transform="translate(80 785)">
    <text x="0" y="0" class="title" font-size="22">Controls:</text>
    <text x="140" y="0" class="body" font-size="20" fill="#4a4e55">left/right = move · center = open/change view · hold center for 1 second = Today</text>
    <text x="140" y="36" class="body" font-size="20" fill="#4a4e55">the selection border matches rarity · every bloomed card can be opened</text>
  </g>
</svg>

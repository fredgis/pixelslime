  </g>

  <g transform="translate(1250 170)">
    <text x="0" y="0" class="title" font-size="28">INTERNAL ASSEMBLY</text>
    <rect x="0" y="45" width="460" height="330" rx="16" fill="#fff" stroke="#c4c7cd" stroke-width="2"/>
    <image x="15" y="57" width="430" height="300" preserveAspectRatio="xMidYMid meet" xlink:href="makerfabs-board-back.jpg"/>
    <rect x="0" y="410" width="460" height="285" rx="16" class="call"/>
    <text x="25" y="451" class="title" font-size="22">Assembly</text>
    <text x="25" y="490" class="body" font-size="19">• Board rotated 90° for portrait use</text>
    <text x="25" y="525" class="body" font-size="19">• Four M2.5 × 6 mm standoffs</text>
    <text x="25" y="560" class="body" font-size="19">• 2 mm screw-fastened rear cover</text>
    <text x="25" y="595" class="body" font-size="19">• USB-C opening at the bottom</text>
    <text x="25" y="630" class="body" font-size="19">• Three 12 mm momentary buttons</text>
    <text x="25" y="665" class="body" font-size="19">• No additional PCB required</text>
    <rect x="0" y="735" width="460" height="165" rx="16" fill="#202329"/>
    <text x="25" y="775" font-family="Arial" font-weight="700" font-size="21" fill="#fff">Proposed external dimensions</text>
    <text x="25" y="820" font-family="Consolas" font-weight="700" font-size="29" fill="#fff">98 × 130 × 22 mm</text>
    <text x="25" y="854" font-family="Arial" font-size="16" fill="#cdd0d5">Confirm against the received board</text>
    <text x="25" y="878" font-family="Arial" font-size="16" fill="#cdd0d5">before finalizing the STL.</text>
  </g>

  <rect x="78" y="1130" width="1640" height="42" rx="8" fill="#dfe1e5"/>
  <text x="98" y="1158" class="body" font-size="18">Scale: close to a compact phone, but thicker. Estimated mass: 150 to 190 g without a battery.</text>

    <g transform="translate(30 55)" filter="url(#shadow)">
      <path d="M65 20h150c31 0 50 19 50 50v650c0 31-19 50-50 50H65c-31 0-50-19-50-50V70c0-31 19-50 50-50z" fill="url(#edge)"/>

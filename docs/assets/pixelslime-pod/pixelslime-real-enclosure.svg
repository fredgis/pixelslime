      <stop stop-color="#772f91"/><stop offset=".55" stop-color="#4d246d"/><stop offset="1" stop-color="#241634"/>
    </linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff5faf"/><stop offset=".55" stop-color="#ef315e"/><stop offset="1" stop-color="#b91e74"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">

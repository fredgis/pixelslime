[project]
name = "pixelslime-backend"
version = "0.1.0"
description = "PixelSlime — one AI collectible card per day, packed into 175 bytes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-storage-blob>=12.24",
    "pillow>=11.0",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.14",
]
chain = [
    "web3>=7.6",
    "eth-account>=0.13",
    "eth-utils>=5.1",
    "azure-keyvault-keys>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests and in codec invariants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# `app` has no __init__.py, so it is a namespace package. Installing the project
# editable also puts `backend/` on sys.path, and mypy then reaches app/codec/ by two
# routes at once - as `codec` (walking up from the file until an __init__.py stops it)
# and as `app.codec` (via the path entry) - and refuses to run at all with "Source file
# found twice under different module names". Pinning the package root to `backend/`
# leaves exactly one answer. Without this, `mypy app` fails before type-checking
# anything, which is why this gate silently never ran.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["web3.*", "eth_account.*", "eth_keys.*", "eth_utils.*"]
ignore_missing_imports = true
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
